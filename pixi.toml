[workspace]
name = "mojo-io"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]
requires-pixi = ">=0.80"

[package]
name = "mojo-io"
version = "0.1.0"
publish = true
license = "MIT"
license-file = "LICENSE"
description = "Binary-safe buffered I/O for Mojo"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*", channels = ["https://prefix.dev/pixi-build-backends", "conda-forge"] }

[package.build.config.pkg]
name = "mojo_io"
path = "mojo_io"

[package.host-dependencies]
mojo-compiler = "=1.2.0"
mojo-bstr = { git = "https://github.com/sstadick/mojo-bstr", rev = "8baa38cfa9fc1f2e5519aaa626094c156124c703" }

[package.build-dependencies]
mojo-compiler = "=1.2.0"
mojo-bstr = { git = "https://github.com/sstadick/mojo-bstr", rev = "8baa38cfa9fc1f2e5519aaa626094c156124c703" }

[package.run-dependencies]
mojo-compiler = "=1.2.0"
mojo-bstr = { git = "https://github.com/sstadick/mojo-bstr", rev = "8baa38cfa9fc1f2e5519aaa626094c156124c703" }

[dependencies]
mojo = "=1.2.0"
python = ">=3.11,<3.15"
mojo-bstr = { git = "https://github.com/sstadick/mojo-bstr", rev = "8baa38cfa9fc1f2e5519aaa626094c156124c703" }
mojo-io = { path = "." }

[tasks]
t = "python scripts/test.py"
format = "mojo format --line-length 100 mojo_io tests bench"
docs = "python scripts/docs.py"
consumer = "python scripts/consumer.py"
bench = "python bench/compare.py"
